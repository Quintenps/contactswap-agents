name = "contactswap-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = [ "nodejs_compat" ]

[vars]
PUBLIC_APP_URL = "http://localhost:3000"
DEFAULT_API_SECRET = "contactswap"
MAILERSEND_EMAIL_FROM = "no-reply@test-zxk54v8nooqljy6v.mlsender.net"
MAILERSEND_ENABLED = "false"

[dev]
port = 8787
local_protocol = "http"

[[d1_databases]]
binding = "D1"
database_name = "contactswap-db"
database_id = "42df6a44-1869-453c-8116-d7ae02df60e1"

[[r2_buckets]]
binding = "R2"
bucket_name = "contactswap-files"

[triggers]
crons = [ "0 3 * * *" ]

[env.production]
name = "contactswap-api"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
